{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Você está offline - Seculus</title>
    <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
    <meta name="theme-color" content="#0B1726">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32.png' %}">
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0B1726;
            color: #F6F2EA;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 16px;
            box-sizing: border-box;
        }
        .caixa { max-width: 420px; text-align: center; }
        .caixa img { width: 96px; height: 96px; border-radius: 50%; }
        .caixa p { color: #D9D3C7; line-height: 1.6; }
        .caixa button {
            background: #B89A65; color: #0B1726; border: 0; border-radius: 999px;
            font-weight: 700; font-size: 16px; padding: 14px 26px; cursor: pointer;
        }
        .caixa a { display: block; margin-top: 16px; color: #B89A65; }
    </style>
</head>
<body>
    <div class="caixa">
        <img src="{% static 'icons/icon-192.png' %}" alt="Seculus">
        <h2>Você está offline</h2>
        <p>Não foi possível conectar à internet. Verifique sua conexão e tente de novo.</p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
        <a href="/">Voltar ao início</a>
    </div>
</body>
</html>
